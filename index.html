<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>RRando</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

/* --------------------------------------------------
   Panneau de commande
   -------------------------------------------------- */

#controls {

  position: absolute;

  top: 10px;
  left: 10px;

  z-index: 1000;

  background: white;

  padding: 8px;

  border-radius: 6px;

  box-shadow:
    0 1px 5px rgba(0,0,0,0.4);

}

/* Boutons */

button {

  display: block;

  width: 170px;

  margin: 4px 0;

  padding: 9px;

  border: 1px solid #999;

  border-radius: 5px;

  background: white;

  font-size: 15px;

}

/* Input fichier caché */

#fileInput {
  display: none;
}

/* Nom du parcours */

#filename {

  max-width: 170px;

  margin-top: 5px;

  font-size: 12px;

  color: #555;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

}

</style>

</head>


<body>


<div id="map"></div>


<div id="controls">

  <button id="loadButton">
    📂 Charger un parcours
  </button>

  <input
    type="file"
    id="fileInput"
    accept=".geojson,.json"
  >

  <button id="gpsButton">
    📍 Ma position
  </button>

  <div id="filename">
    Aucun parcours chargé
  </div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// ==================================================
// CARTE
// ==================================================

var map = L.map("map");


L.tileLayer(

  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 17,

    attribution:
      "&copy; OpenStreetMap contributors, " +
      "SRTM | OpenTopoMap"

  }

).addTo(map);


// Position initiale
map.setView(
  [45.184, 5.679],
  13
);


// ==================================================
// COULEUR DES PENTES
// ==================================================

function couleurPente(pente) {
  pente = Number(pente);

  if (!isFinite(pente)) return "#808080";

  if (pente <= 2.5) return "#00A000";   // vert
  if (pente <= 7.5) return "#FFD700";   // jaune
  if (pente <= 12.5) return "#E00000";  // rouge
  return "#000000";                     // noir
}


// ==================================================
// COUCHE DU PARCOURS
// ==================================================

var parcoursLayer = null;


// ==================================================
// CHARGEMENT D'UN GEOJSON
// ==================================================

function chargerParcours(data, nomFichier) {


  // Supprimer l'ancien parcours

  if (parcoursLayer !== null) {

    map.removeLayer(parcoursLayer);

  }


  // Créer le nouveau parcours

  parcoursLayer = L.geoJSON(

    data,

    {


      // ------------------------------------------------
      // Style des tronçons
      // ------------------------------------------------

      style: function(feature) {

        return {

          color:
            couleurPente(
              feature.properties.pente_pct
            ),

          weight: 6,

          opacity: 0.9

        };

      },


      // ------------------------------------------------
      // Informations au clic
      // ------------------------------------------------

      onEachFeature:
        function(feature, layer) {


          var p =
            feature.properties;


          var pente =
            Number(p.pente_pct);


          var debut =
            Number(p.distance_debut);


          var fin =
            Number(p.distance_fin);


          layer.bindPopup(

            "<b>Tronçon " +
            (p.id ?? "") +
            "</b><br><br>" +

            "Pente moyenne : " +

            "<b>" +

            (isFinite(pente)
              ? pente.toFixed(1)
              : "N/A") +

            " %</b><br>" +

            "Distance début : " +

            (isFinite(debut)
              ? debut.toFixed(0)
              : "N/A") +

            " m<br>" +

            "Distance fin : " +

            (isFinite(fin)
              ? fin.toFixed(0)
              : "N/A") +

            " m"

          );


        }

    }

  ).addTo(map);


  // ------------------------------------------------
  // Ajustement automatique
  // ------------------------------------------------

  if (
    parcoursLayer.getBounds().isValid()
  ) {

    map.fitBounds(

      parcoursLayer.getBounds(),

      {
        padding: [30, 30]
      }

    );

  }


  // Nom du fichier

  document.getElementById(
    "filename"
  ).textContent =
    nomFichier;


}


// ==================================================
// BOUTON CHARGER
// ==================================================

document
  .getElementById("loadButton")
  .addEventListener(

    "click",

    function() {

      document
        .getElementById("fileInput")
        .click();

    }

  );


// ==================================================
// LECTURE DU FICHIER
// ==================================================

document
  .getElementById("fileInput")
  .addEventListener(

    "change",

    function(event) {


      var file =
        event.target.files[0];


      if (!file)
        return;


      var reader =
        new FileReader();


      reader.onload =
        function(e) {


          try {


            var data =
              JSON.parse(
                e.target.result
              );


            chargerParcours(
              data,
              file.name
            );


          }

          catch(error) {


            alert(
              "Impossible de lire le fichier GeoJSON."
            );


            console.error(
              error
            );


          }

        };


      reader.readAsText(file);


    }

  );


// ==================================================
// GPS
// ==================================================

var positionMarker = null;

var positionCircle = null;

var gpsWatch = null;


// ==================================================
// MISE À JOUR POSITION
// ==================================================

function mettreAJourPosition(
  position
) {


  var lat =
    position.coords.latitude;


  var lon =
    position.coords.longitude;


  var accuracy =
    position.coords.accuracy;


  // Première position

  if (
    positionMarker === null
  ) {


    positionMarker =
      L.marker(

        [lat, lon],

        {
          title: "Ma position"
        }

      ).addTo(map);


    positionCircle =
      L.circle(

        [lat, lon],

        {

          radius: accuracy,

          weight: 2,

          fillOpacity: 0.15

        }

      ).addTo(map);


  }

  else {


    positionMarker.setLatLng(
      [lat, lon]
    );


    positionCircle.setLatLng(
      [lat, lon]
    );


    positionCircle.setRadius(
      accuracy
    );


  }


  positionMarker.bindPopup(

    "<b>Ma position</b><br>" +

    "Latitude : " +

    lat.toFixed(6) +

    "<br>" +

    "Longitude : " +

    lon.toFixed(6) +

    "<br>" +

    "Précision : " +

    Math.round(accuracy) +

    " m"

  );


}


// ==================================================
// DEMARRAGE GPS
// ==================================================

function demarrerGPS() {


  if (
    !navigator.geolocation
  ) {


    alert(
      "La géolocalisation n'est pas disponible."
    );


    return;

  }


  // Première position

  navigator.geolocation.getCurrentPosition(

    function(position) {


      mettreAJourPosition(
        position
      );


      map.setView(

        [

          position.coords.latitude,

          position.coords.longitude

        ],

        16

      );


    },


    function(error) {


      alert(

        "Impossible d'obtenir la position GPS : " +

        error.message

      );


    },


    {

      enableHighAccuracy: true,

      maximumAge: 5000,

      timeout: 10000

    }

  );


  // Suivi continu

  if (
    gpsWatch !== null
  ) {

    navigator.geolocation.clearWatch(
      gpsWatch
    );

  }


  gpsWatch =
    navigator.geolocation.watchPosition(

      function(position) {

        mettreAJourPosition(
          position
        );

      },


      function(error) {

        console.log(
          "Erreur GPS :",
          error.message
        );

      },


      {

        enableHighAccuracy: true,

        maximumAge: 5000,

        timeout: 10000

      }

    );

}


// ==================================================
// BOUTON GPS
// ==================================================

document
  .getElementById("gpsButton")
  .addEventListener(

    "click",

    demarrerGPS

  );


</script>

</body>

</html>
