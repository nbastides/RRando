<head>

<style>

/* ==================================================
   CARTE
   ================================================== */

html, body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

}

#map {

  width: 100%;
  height: 100%;

}


/* ==================================================
   COMMANDES GPS COMPACTES
   ================================================== */

#controls {

  position: absolute;

  top: 10px;
  left: 10px;

  z-index: 1000;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

}


/* ==================================================
   BOUTONS
   ================================================== */

#loadButton,
#gpsButton,
#followButton {

  display: block;

  width: 36px;
  height: 36px;

  margin: 0 0 6px 0;

  padding: 0;

  border:
    1px solid rgba(255,255,255,0.75);

  border-radius: 50%;

  background:
    rgba(255,255,255,0.72);

  backdrop-filter: blur(4px);

  -webkit-backdrop-filter: blur(4px);

  box-shadow:
    0 2px 6px rgba(0,0,0,0.30);

  font-size: 18px;

  line-height: 34px;

  text-align: center;

  cursor: pointer;

  transition:
    background 0.15s ease,
    transform 0.15s ease;

}


#loadButton:hover,
#gpsButton:hover,
#followButton:hover {

  background:
    rgba(255,255,255,0.90);

  transform: scale(1.08);

}


#loadButton:active,
#gpsButton:active,
#followButton:active {

  transform: scale(0.92);

}


/* ==================================================
   VITESSE GPS
   ================================================== */

#speed {

  margin: 0 0 5px 0;

  padding: 4px 7px;

  background:
    rgba(255,255,255,0.72);

  backdrop-filter: blur(4px);

  -webkit-backdrop-filter: blur(4px);

  border-radius: 10px;

  box-shadow:
    0 2px 6px rgba(0,0,0,0.25);

  font-size: 12px;

  font-weight: 600;

  white-space: nowrap;

  color: #222;

}


/* ==================================================
   PRECISION GPS
   ================================================== */

#accuracy {

  margin: 0 0 6px 0;

  padding: 4px 7px;

  background:
    rgba(255,255,255,0.72);

  backdrop-filter: blur(4px);

  -webkit-backdrop-filter: blur(4px);

  border-radius: 10px;

  box-shadow:
    0 2px 6px rgba(0,0,0,0.25);

  font-size: 11px;

  font-weight: 600;

  white-space: nowrap;

  color: #555;

}


/* ==================================================
   INPUT FICHIER
   ================================================== */

#fileInput {

  display: none;

}

</style>

</head>

<!-- ==================================================

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<script>


// ==================================================
// CARTE
// ==================================================

var map = L.map("map");


L.tileLayer(

  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 17,

    attribution:
      "&copy; OpenStreetMap contributors, " +
      "SRTM | OpenTopoMap"

  }

).addTo(map);


// Position initiale

map.setView(

  [45.184, 5.679],

  13

);


// ==================================================
// COULEUR DES PENTES
// ==================================================

function couleurPente(pente) {

  pente = Number(pente);


  if (!isFinite(pente))

    return "#808080";


  if (pente <= 2.5)

    return "#00A000";


  if (pente <= 7.5)

    return "#FFD700";


  if (pente <= 12.5)

    return "#E00000";


  return "#000000";

}


// ==================================================
// COUCHE DU PARCOURS
// ==================================================

var parcoursLayer = null;


// ==================================================
// CHARGEMENT D'UN GEOJSON
// ==================================================

function chargerParcours(data, nomFichier) {


  // ----------------------------------------------
  // Supprimer l'ancien parcours
  // ----------------------------------------------

  if (parcoursLayer !== null) {

    map.removeLayer(parcoursLayer);

  }


  // ----------------------------------------------
  // Créer le nouveau parcours
  // ----------------------------------------------

  parcoursLayer = L.geoJSON(

    data,

    {

      // --------------------------------------------
      // Style des tronçons
      // --------------------------------------------

      style: function(feature) {

        return {

          color:
            couleurPente(
              feature.properties.pente_pct
            ),

          weight: 6,

          opacity: 0.9

        };

      },


      // --------------------------------------------
      // Informations au clic
      // --------------------------------------------

      onEachFeature:
        function(feature, layer) {


          var p =
            feature.properties;


          var pente =
            Number(p.pente_pct);


          var debut =
            Number(p.distance_debut);


          var fin =
            Number(p.distance_fin);


          layer.bindPopup(

            "<b>Tronçon " +

            (p.id ?? "") +

            "</b><br><br>" +


            "Pente moyenne : " +


            "<b>" +


            (isFinite(pente)

              ? pente.toFixed(1)

              : "N/A") +


            " %</b><br>" +


            "Distance début : " +


            (isFinite(debut)

              ? debut.toFixed(0)

              : "N/A") +


            " m<br>" +


            "Distance fin : " +


            (isFinite(fin)

              ? fin.toFixed(0)

              : "N/A") +


            " m"

          );


        }

    }

  ).addTo(map);


  // ----------------------------------------------
  // Ajustement automatique
  // ----------------------------------------------

  if (

    parcoursLayer.getBounds().isValid()

  ) {

    map.fitBounds(

      parcoursLayer.getBounds(),

      {

        padding: [30, 30]

      }

    );

  }

}


// ==================================================
// BOUTON CHARGER
// ==================================================

document

  .getElementById("loadButton")

  .addEventListener(

    "click",

    function() {

      document

        .getElementById("fileInput")

        .click();

    }

  );


// ==================================================
// LECTURE DU FICHIER
// ==================================================

document

  .getElementById("fileInput")

  .addEventListener(

    "change",

    function(event) {


      var file =
        event.target.files[0];


      if (!file)

        return;


      var reader =
        new FileReader();


      reader.onload =
        function(e) {


          try {


            var data =
              JSON.parse(
                e.target.result
              );


            chargerParcours(

              data,

              file.name

            );


          }

          catch(error) {


            alert(

              "Impossible de lire le fichier GeoJSON."

            );


            console.error(

              error

            );

          }

        };


      reader.readAsText(file);

    }

  );


// ==================================================
// GPS
// ==================================================

var positionMarker = null;

var positionCircle = null;

var gpsWatch = null;


// ==================================================
// SUIVI AUTOMATIQUE
// ==================================================

var suivreGPS = true;


// ==================================================
// POSITION GPS PRECEDENTE
// ==================================================

var dernierePosition = null;


// ==================================================
// HISTORIQUE DES VITESSES
// ==================================================

var historiqueVitesses = [];

var nombreMesuresVitesse = 5;


// ==================================================
// CALCUL DE LA VITESSE
// ==================================================

function calculerVitesse(position) {


  var lat =
    position.coords.latitude;


  var lon =
    position.coords.longitude;


  var timestamp =
    position.timestamp;


  // ----------------------------------------------
  // Première mesure
  // ----------------------------------------------

  if (

    dernierePosition === null

  ) {


    dernierePosition = {

      lat: lat,

      lon: lon,

      timestamp: timestamp

    };


    return null;

  }


  // ----------------------------------------------
  // Temps écoulé
  // ----------------------------------------------

  var dt =

    (

      timestamp -

      dernierePosition.timestamp

    ) / 1000;


  // ----------------------------------------------
  // Vérification
  // ----------------------------------------------

  if (

    dt <= 0

  ) {

    return null;

  }


  // ----------------------------------------------
  // Distance
  // ----------------------------------------------

  var distance =

    map.distance(

      [

        dernierePosition.lat,

        dernierePosition.lon

      ],

      [

        lat,

        lon

      ]

    );


  // ----------------------------------------------
  // Mémoriser la nouvelle position
  // ----------------------------------------------

  dernierePosition = {

    lat: lat,

    lon: lon,

    timestamp: timestamp

  };


  // ----------------------------------------------
  // Ignorer les déplacements < 3 m
  // ----------------------------------------------

  if (

    distance < 3

  ) {

    return 0;

  }


  // ----------------------------------------------
  // Vitesse m/s
  // ----------------------------------------------

  var vitesseMS =

    distance / dt;


  // ----------------------------------------------
  // Conversion km/h
  // ----------------------------------------------

  var vitesseKMH =

    vitesseMS * 3.6;


  return vitesseKMH;

}
