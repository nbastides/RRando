<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>RRando</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIINfQ3JQ2x6q9Y9Y2xGxK9q5h7x5V8x4="
          crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <style>

        /* =========================================================
           Carte
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }


        /* =========================================================
           Bloc des contrôles GPS
           ========================================================= */

        #controls {

            position: absolute;

            top: 10px;
            left: 10px;

            z-index: 1000;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }


        /* =========================================================
           Boutons ronds compacts
           ========================================================= */

        #loadButton,
        #gpsButton,
        #followButton {

            width: 36px;
            height: 36px;

            padding: 0;
            margin-bottom: 6px;

            border: 1px solid rgba(255,255,255,0.7);

            border-radius: 50%;

            background: rgba(255,255,255,0.72);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            box-shadow: 0 2px 6px rgba(0,0,0,0.30);

            font-size: 18px;
            line-height: 36px;

            text-align: center;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }


        /* =========================================================
           Effet souris
           ========================================================= */

        #loadButton:hover,
        #gpsButton:hover,
        #followButton:hover {

            background: rgba(255,255,255,0.90);

            transform: scale(1.08);
        }


        /* =========================================================
           Effet clic
           ========================================================= */

        #loadButton:active,
        #gpsButton:active,
        #followButton:active {

            transform: scale(0.92);
        }


        /* =========================================================
           Informations vitesse / précision GPS
           ========================================================= */

        #speed,
        #accuracy {

            background: rgba(255,255,255,0.72);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            padding: 4px 7px;

            margin-bottom: 5px;

            border-radius: 10px;

            box-shadow: 0 2px 6px rgba(0,0,0,0.25);

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;
        }


        /* =========================================================
           Curseur GPS
           ========================================================= */

        .gps-marker {

            width: 16px;
            height: 16px;

            background: #1976D2;

            border: 3px solid white;

            border-radius: 50%;

            box-shadow:
                0 0 0 2px rgba(25,118,210,0.35),
                0 2px 5px rgba(0,0,0,0.35);
        }

    </style>

</head>


<body>


    <!-- =========================================================
         CONTROLES
         ========================================================= -->

    <div id="controls">

        <!-- Charger un parcours -->
        <button id="loadButton"
                title="Charger un parcours">
            📂
        </button>

        <input type="file"
               id="fileInput"
               accept=".geojson,.json"
               style="display:none;">


        <!-- Position GPS -->
        <button id="gpsButton"
                title="Ma position">
            📍
        </button>


        <!-- Vitesse -->
        <div id="speed">
            🚲 -- km/h
        </div>


        <!-- Précision GPS -->
        <div id="accuracy">
            📡 -- m
        </div>


        <!-- Suivi automatique -->
        <button id="followButton"
                title="Arrêter le suivi">
            ⛔
        </button>

    </div>


    <!-- =========================================================
         CARTE
         ========================================================= -->

    <div id="map"></div>


    <script>


        /* =========================================================
           INITIALISATION DE LA CARTE
           ========================================================= */

        const map = L.map("map");


        L.tileLayer(
            "https://{s}.tile.opentopomap.de/{z}/{x}/{y}.png",
            {
                maxZoom: 17,

                attribution:
                    '© OpenStreetMap contributors, SRTM | ' +
                    '© OpenTopoMap'
            }
        ).addTo(map);


        /* Vue initiale */

        map.setView(
            [45.184, 5.679],
            13
        );


        /* =========================================================
           VARIABLES
           ========================================================= */

        let parcoursLayer = null;

        let positionMarker = null;

        let positionCircle = null;

        let gpsWatch = null;


        /* Suivi automatique de la carte */

        let suivreGPS = true;


        /* Dernière position utilisée pour calculer la vitesse */

        let dernierePosition = null;


        /* Historique des vitesses */

        let historiqueVitesses = [];


        /* =========================================================
           COULEURS DES CLASSES DE PENTE
           ========================================================= */

        function couleurPente(pente) {

            if (pente === null || pente === undefined || isNaN(pente)) {

                return "#808080";

            }

            pente = Number(pente);


            if (pente <= 2.5) {

                return "#00A000";

            }

            else if (pente <= 7.5) {

                return "#FFD700";

            }

            else if (pente <= 12.5) {

                return "#E00000";

            }

            else {

                return "#000000";

            }
        }


        /* =========================================================
           CHARGEMENT D'UN PARCOURS GEOJSON
           ========================================================= */

        function chargerParcours(data, nomFichier) {


            /* Supprimer l'ancien parcours */

            if (parcoursLayer) {

                map.removeLayer(parcoursLayer);

            }


            /* Créer le nouveau parcours */

            parcoursLayer = L.geoJSON(
                data,
                {

                    style: function(feature) {

                        const pente =
                            feature.properties
                                ? feature.properties.pente_pct
                                : null;

                        return {

                            color: couleurPente(pente),

                            weight: 6,

                            opacity: 0.9

                        };
                    },


                    onEachFeature: function(feature, layer) {

                        const p =
                            feature.properties || {};


                        let contenu = "";


                        if (p.id !== undefined) {

                            contenu +=
                                "<b>Tronçon :</b> " +
                                p.id +
                                "<br>";

                        }


                        if (p.pente_pct !== undefined) {

                            contenu +=
                                "<b>Pente :</b> " +
                                p.pente_pct +
                                " %" +
                                "<br>";

                        }


                        if (p.distance_debut !== undefined) {

                            contenu +=
                                "<b>Distance début :</b> " +
                                p.distance_debut +
                                "<br>";

                        }


                        if (p.distance_fin !== undefined) {

                            contenu +=
                                "<b>Distance fin :</b> " +
                                p.distance_fin;

                        }


                        if (contenu !== "") {

                            layer.bindPopup(contenu);

                        }

                    }

                }
            );


            parcoursLayer.addTo(map);


            /* Adapter la carte au parcours */

            if (parcoursLayer.getBounds().isValid()) {

                map.fitBounds(
                    parcoursLayer.getBounds(),
                    {
                        padding: [30, 30]
                    }
                );

            }

        }


        /* =========================================================
           BOUTON CHARGER
           ========================================================= */

        document
            .getElementById("loadButton")
            .addEventListener(
                "click",
                function() {

                    document
                        .getElementById("fileInput")
                        .click();

                }
            );


        /* =========================================================
           LECTURE DU FICHIER GEOJSON
           ========================================================= */

        document
            .getElementById("fileInput")
            .addEventListener(
                "change",
                function(event) {


                    const fichier =
                        event.target.files[0];


                    if (!fichier) {

                        return;

                    }


                    const lecteur =
                        new FileReader();


                    lecteur.onload =
                        function(e) {

                            try {

                                const data =
                                    JSON.parse(
                                        e.target.result
                                    );


                                chargerParcours(
                                    data,
                                    fichier.name
                                );

                            }


                            catch (erreur) {

                                alert(
                                    "Impossible de lire le fichier GeoJSON.\n\n" +
                                    erreur.message
                                );

                            }

                        };


                    lecteur.readAsText(fichier);

                }
            );


        /* =========================================================
           MISE A JOUR DE LA VITESSE
           ========================================================= */

        function mettreAJourVitesse(position) {


            if (dernierePosition === null) {

                dernierePosition = position;

                return;

            }


            const lat1 =
                dernierePosition.coords.latitude;

            const lon1 =
                dernierePosition.coords.longitude;


            const lat2 =
                position.coords.latitude;

            const lon2 =
                position.coords.longitude;


            /* Temps écoulé en secondes */

            const dt =
                (
                    position.timestamp -
                    dernierePosition.timestamp
                ) / 1000;


            if (dt <= 0) {

                return;

            }


            /* Distance entre les deux positions */

            const distance =
                map.distance(
                    [lat1, lon1],
                    [lat2, lon2]
                );


            /*
             * On considère qu'un déplacement inférieur
             * à 3 m correspond au bruit GPS.
             */

            let vitesse;


            if (distance < 3) {

                vitesse = 0;

            }

            else {

                vitesse =
                    (distance / dt) * 3.6;

            }


            /* Ajouter à l'historique */

            historiqueVitesses.push(vitesse);


            /*
             * Conserver seulement les
             * 5 dernières mesures
             */

            if (historiqueVitesses.length > 5) {

                historiqueVitesses.shift();

            }


            /* Moyenne glissante */

            const somme =
                historiqueVitesses.reduce(
                    function(a, b) {

                        return a + b;

                    },
                    0
                );


            const vitesseMoyenne =
                somme /
                historiqueVitesses.length;


            /* Affichage */

            document
                .getElementById("speed")
                .textContent =
                    "🚲 " +
                    vitesseMoyenne.toFixed(1) +
                    " km/h";


            /* Mémoriser la position */

            dernierePosition = position;

        }


        /* =========================================================
           MISE A JOUR DE LA POSITION GPS
           ========================================================= */

        function mettreAJourPosition(position) {


            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            const precision =
                position.coords.accuracy;


            /* =====================================================
               VITESSE
               ===================================================== */

            mettreAJourVitesse(position);


            /* =====================================================
               PRECISION GPS
               ===================================================== */

            document
                .getElementById("accuracy")
                .textContent =
                    "📡 " +
                    Math.round(precision) +
                    " m";


            /* =====================================================
               MARQUEUR GPS
               ===================================================== */

            if (!positionMarker) {


                const iconeGPS =
                    L.divIcon(
                        {
                            className: "",

                            html:
                                '<div class="gps-marker"></div>',

                            iconSize: [22, 22],

                            iconAnchor: [11, 11]

                        }
                    );


                positionMarker =
                    L.marker(
                        [lat, lon],
                        {
                            icon: iconeGPS
                        }
                    ).addTo(map);


                positionMarker.bindPopup(
                    "Position GPS"
                );

            }


            else {

                positionMarker.setLatLng(
                    [lat, lon]
                );

            }


            /* =====================================================
               CERCLE DE PRECISION
               ===================================================== */

            if (!positionCircle) {


                positionCircle =
                    L.circle(
                        [lat, lon],
                        {

                            radius: precision,

                            color: "#1976D2",

                            weight: 1,

                            opacity: 0.5,

                            fillColor: "#1976D2",

                            fillOpacity: 0.12

                        }
                    ).addTo(map);

            }


            else {

                positionCircle.setLatLng(
                    [lat, lon]
                );


                positionCircle.setRadius(
                    precision
                );

            }


            /* =====================================================
               SUIVI AUTOMATIQUE DE LA CARTE
               ===================================================== */

            if (suivreGPS) {


                map.panTo(
                    [lat, lon],
                    {
                        animate: true,

                        duration: 0.5
                    }
                );

            }

        }


        /* =========================================================
           DEMARRER LE GPS
           ========================================================= */

        function demarrerGPS() {


            if (!navigator.geolocation) {

                alert(
                    "La géolocalisation n'est pas disponible sur cet appareil."
                );

                return;

            }


            /* Activer le suivi */

            suivreGPS = true;


            /* Réinitialiser le calcul de vitesse */

            dernierePosition = null;

            historiqueVitesses = [];


            document
                .getElementById("speed")
                .textContent =
                    "🚲 -- km/h";


            /* =====================================================
               PREMIERE POSITION
               ===================================================== */

            navigator.geolocation.getCurrentPosition(

                function(position) {


                    mettreAJourPosition(
                        position
                    );


                    map.setView(
                        [
                            position.coords.latitude,
                            position.coords.longitude
                        ],
                        16
                    );

                },


                function(erreur) {

                    alert(
                        "Impossible d'obtenir la position GPS.\n\n" +
                        erreur.message
                    );

                },


                {

                    enableHighAccuracy: true,

                    maximumAge: 5000,

                    timeout: 10000

                }

            );


            /* =====================================================
               SUIVI CONTINU
               ===================================================== */

            if (gpsWatch !== null) {

                navigator.geolocation.clearWatch(
                    gpsWatch
                );

            }


            gpsWatch =
                navigator.geolocation.watchPosition(

                    function(position) {

                        mettreAJourPosition(
                            position
                        );

                    },


                    function(erreur) {

                        console.warn(
                            "Erreur GPS :",
                            erreur
                        );

                    },


                    {

                        enableHighAccuracy: true,

                        maximumAge: 5000,

                        timeout: 10000

                    }

                );


            /* Etat du bouton */

            document
                .getElementById("followButton")
                .textContent = "⛔";


            document
                .getElementById("followButton")
                .title =
                    "Arrêter le suivi";

        }


        /* =========================================================
           ARRETER LE SUIVI DE LA CARTE
           ========================================================= */

        function arreterSuiviGPS() {


            suivreGPS = false;


            document
                .getElementById("followButton")
                .textContent = "▶️";


            document
                .getElementById("followButton")
                .title =
                    "Reprendre le suivi";

        }


        /* =========================================================
           BOUTON GPS
           ========================================================= */

        document
            .getElementById("gpsButton")
            .addEventListener(
                "click",
                function() {

                    demarrerGPS();

                }
            );


        /* =========================================================
           BOUTON SUIVI
           ========================================================= */

        document
            .getElementById("followButton")
            .addEventListener(
                "click",
                function() {


                    if (suivreGPS) {

                        arreterSuiviGPS();

                    }

                    else {


                        suivreGPS = true;


                        /*
                         * Si nous avons déjà une position GPS,
                         * recentrer immédiatement la carte.
                         */

                        if (positionMarker) {

                            map.panTo(
                                positionMarker.getLatLng(),
                                {
                                    animate: true,

                                    duration: 0.5
                                }
                            );

                        }


                        this.textContent = "⛔";

                        this.title =
                            "Arrêter le suivi";

                    }

                }
            );


    </script>

</body>

</html>
